apply plugin: 'com.android.application'

android {
    namespace 'com.screamrunner.game'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.screamrunner.arcade"
        testInstrumentationRunner "com.screamrunner.game.RegressionInstrumentation"
        minSdk 23
        targetSdk 34
        versionCode 9
        versionName "3.0.3-rc1"
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig null
        }
        debug {
            debuggable true
        }
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/com/android/build/gradle/app-metadata.properties',
                'META-INF/*.kotlin_module',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero third-party libraries: uses pure Android SDK (HttpURLConnection, org.json, AudioRecord, Canvas)
}

apply from: rootProject.file("release-signing.gradle")

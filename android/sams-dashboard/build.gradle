apply plugin: 'com.android.application'

android {
    namespace 'com.samsdashboard.admin'
    compileSdk 34
    buildToolsVersion "34.0.0"

    defaultConfig {
        applicationId "com.sams.telemetry.console"
        minSdk 23
        targetSdk 34
        versionCode 7
        versionName "3.0.1-review"
    }

    buildTypes {
        release {
            debuggable false
            minifyEnabled false
            signingConfig null
        }
        debug {
            debuggable true
        }
    }

    packagingOptions {
        resources {
            excludes += [
                'META-INF/com/android/build/gradle/app-metadata.properties',
                'META-INF/*.kotlin_module',
                'META-INF/DEPENDENCIES',
                'META-INF/LICENSE*',
                'META-INF/NOTICE*'
            ]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    // Zero third-party libraries: uses pure Android SDK (HttpURLConnection, org.json, MediaPlayer, Canvas)
}

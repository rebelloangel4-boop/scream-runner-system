name: Android device regression
on:
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [34, 35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install test SDK and image
        run: |
          sdkmanager 'platforms;android-34' 'build-tools;34.0.0' 'emulator' 'platform-tools' 'system-images;android-${{ matrix.api }};google_apis;x86_64'
          sudo chmod 666 /dev/kvm
      - name: Build and lint both apps and test APKs
        run: bash android/gradlew -p android --no-daemon --console=plain assembleDebug assembleDebugAndroidTest lintDebug
      - name: Boot emulator and run actual Android tests
        run: |
          echo no | avdmanager create avd -n regression -k 'system-images;android-${{ matrix.api }};google_apis;x86_64' --device pixel --force
          "$ANDROID_HOME/emulator/emulator" -avd regression -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > emulator.log 2>&1 &
          adb wait-for-device
          booted=0
          for attempt in $(seq 1 120); do
            if adb shell getprop sys.boot_completed | tr -d '\r' | grep -q '^1$'; then booted=1; break; fi
            sleep 5
          done
          test "$booted" = 1
          bash scripts/test_android_emulator.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-${{ matrix.api }}-regression-evidence
          path: |
            test-results/
            emulator.log
            /tmp/android-build/*/reports/lint-results-debug.*

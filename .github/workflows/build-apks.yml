name: Build and Release Android APKs

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install Android Build-Tools & Platform 33
      run: |
        sdkmanager --install "platforms;android-33" "build-tools;33.0.2"

    - name: Build Standalone APKs
      run: |
        bash scripts/build_apks.sh

    - name: Upload Scream Runner APK
      uses: actions/upload-artifact@v4
      with:
        name: scream-runner-apk
        path: public/downloads/scream-runner.apk
        retention-days: 30

    - name: Upload Sam's Dashboard APK
      uses: actions/upload-artifact@v4
      with:
        name: sams-dashboard-apk
        path: public/downloads/sams-dashboard.apk
        retention-days: 30

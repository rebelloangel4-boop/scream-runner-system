name: Build Android APKs

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apks:
    name: Build Scream Runner & Sam's Dashboard Release APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK Platform 34 & Build-Tools 34.0.0
        run: |
          echo "y" | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-34" "build-tools;34.0.0"

      - name: Build Both Standalone Release APKs with Gradle
        run: |
          chmod +x android/gradlew scripts/build_apks.sh
          bash scripts/build_apks.sh

      - name: Upload Scream Runner APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scream-runner-apk
          path: public/downloads/scream-runner.apk
          if-no-files-found: error

      - name: Upload Sam's Dashboard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sams-dashboard-apk
          path: public/downloads/sams-dashboard.apk
          if-no-files-found: error

